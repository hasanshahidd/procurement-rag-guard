<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Procurement RAG Guard</title>
<link rel="icon" href="data:,">
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f6f8; --surface: #ffffff; --surface-2: #f3f4f7; --surface-3: #e8ebf0;
    --border: #e3e6eb; --border-strong: #cdd2da;
    --text: #15181d; --text-2: #3d4450; --muted: #5d6573;
    --accent: #3352cc; --accent-soft: #ebeffc; --accent-ring: rgba(51, 82, 204, 0.22);
    --ink: #15181d; --ink-hover: #2c313a; --on-ink: #ffffff;
    --ok: #14773f; --ok-bg: #e6f4ec; --ok-line: #b5dfc6;
    --warn: #8a4b00; --warn-bg: #fdf2de; --warn-line: #f1d29b; --warn-solid: #f5a524; --on-warn-solid: #3a2400;
    --bad: #b42318; --bad-bg: #fdecea; --bad-line: #f5c2bd; --bad-solid: #c9302c;
    --conflict: #6a3dc0; --conflict-bg: #f2edfc; --conflict-line: #d8c9f5; --conflict-solid: #7c4dd6;
    --info: #475467; --info-bg: #eef1f5; --info-line: #d5dbe3;
    --shadow-1: 0 1px 2px rgba(17, 24, 39, 0.05);
    --shadow-2: 0 1px 2px rgba(17, 24, 39, 0.04), 0 8px 24px -8px rgba(17, 24, 39, 0.10);
    --shadow-3: 0 24px 48px -12px rgba(17, 24, 39, 0.28), 0 2px 6px rgba(17, 24, 39, 0.06);
    --backdrop: rgba(15, 18, 24, 0.42);
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    --display: -apple-system, BlinkMacSystemFont, "Segoe UI Variable Display", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    --mono: "Cascadia Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --tone: var(--text-2); --tone-bg: var(--surface-2); --tone-line: var(--border);
    --tone-solid: var(--surface-2); --on-tone-solid: var(--text-2);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --surface: #16191e; --surface-2: #1b1f25; --surface-3: #262b33;
      --border: #272c34; --border-strong: #363c46;
      --text: #e9ebef; --text-2: #b9bfc9; --muted: #9098a5;
      --accent: #8ea4ff; --accent-soft: #1e2542; --accent-ring: rgba(142, 164, 255, 0.30);
      --ink: #e9ebef; --ink-hover: #ffffff; --on-ink: #111318;
      --ok: #5fcf95; --ok-bg: #12291d; --ok-line: #1f4a33;
      --warn: #f3b85e; --warn-bg: #2d2310; --warn-line: #5a4319; --on-warn-solid: #2a1a00;
      --bad: #ff8f84; --bad-bg: #33171a; --bad-line: #5c2629;
      --conflict: #c3a6ff; --conflict-bg: #251c3a; --conflict-line: #43356a;
      --info: #aab4c3; --info-bg: #1f242c; --info-line: #343b46;
      --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.4);
      --shadow-2: 0 1px 2px rgba(0, 0, 0, 0.35), 0 8px 24px -8px rgba(0, 0, 0, 0.5);
      --shadow-3: 0 24px 48px -12px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.04);
      --backdrop: rgba(0, 0, 0, 0.6);
    }
  }

  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font: 14px/1.5 var(--sans); }
  h1, h2, h3, p, ul, ol, dl, blockquote { margin: 0; }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  .skip { position: absolute; left: 16px; top: -48px; z-index: 50; padding: 8px 12px; border-radius: 8px; background: var(--ink); color: var(--on-ink); }
  .skip:focus { top: 8px; }
  .mono { font-family: var(--mono); font-size: 0.92em; overflow-wrap: anywhere; }
  .tnum { font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); }
  .icon { flex: none; display: block; }

  /* Tones: status colour always travels with a text label */
  .tone-ok { --tone: var(--ok); --tone-bg: var(--ok-bg); --tone-line: var(--ok-line); --tone-solid: var(--ok-bg); --on-tone-solid: var(--ok); }
  .tone-warn { --tone: var(--warn); --tone-bg: var(--warn-bg); --tone-line: var(--warn-line); --tone-solid: var(--warn-solid); --on-tone-solid: var(--on-warn-solid); }
  .tone-bad { --tone: var(--bad); --tone-bg: var(--bad-bg); --tone-line: var(--bad-line); --tone-solid: var(--bad-solid); --on-tone-solid: #ffffff; }
  .tone-conflict { --tone: var(--conflict); --tone-bg: var(--conflict-bg); --tone-line: var(--conflict-line); --tone-solid: var(--conflict-solid); --on-tone-solid: #ffffff; }
  .tone-info { --tone: var(--info); --tone-bg: var(--info-bg); --tone-line: var(--info-line); --tone-solid: var(--info-bg); --on-tone-solid: var(--info); }
  .tone-idle { --tone: var(--muted); --tone-bg: var(--surface); --tone-line: var(--border-strong); --tone-solid: var(--surface); --on-tone-solid: var(--muted); }

  /* Buttons and fields */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 36px; padding: 0 14px;
    border: 1px solid transparent; border-radius: 8px; font-size: 13.5px; font-weight: 600; white-space: nowrap; cursor: pointer;
    transition-property: background-color, border-color, color, box-shadow, transform; transition-duration: 150ms; transition-timing-function: ease-out; }
  .btn:active:not(:disabled) { transform: scale(0.97); }
  .btn:disabled { cursor: not-allowed; opacity: 0.6; }
  .btn-primary { background: var(--ink); color: var(--on-ink); box-shadow: var(--shadow-1); }
  .btn-primary:hover:not(:disabled) { background: var(--ink-hover); }
  .btn-primary.is-busy:disabled { opacity: 1; cursor: progress; }
  .btn-secondary { background: var(--surface); border-color: var(--border-strong); color: var(--text); box-shadow: var(--shadow-1); }
  .btn-secondary:hover:not(:disabled) { background: var(--surface-2); }
  .btn-ghost { background: transparent; color: var(--text-2); }
  .btn-ghost:hover:not(:disabled) { background: var(--surface-3); color: var(--text); }
  .btn-sm { height: 32px; padding: 0 10px; font-size: 12.5px; }
  .btn-icon { width: 36px; padding: 0; }
  .btn-icon.btn-sm { width: 32px; }
  .input { width: 100%; height: 38px; padding: 0 12px; border: 1px solid var(--border-strong); border-radius: 8px;
    background: var(--surface); font-size: 14px; transition: border-color 150ms ease-out, box-shadow 150ms ease-out; }
  textarea.input { height: auto; padding: 10px 12px; line-height: 1.5; resize: vertical; }
  .input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-ring); }
  .field { display: grid; gap: 6px; }
  .field-label { font-size: 13px; font-weight: 600; color: var(--text-2); }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  kbd { font: 500 11px/1 var(--sans); padding: 3px 5px; border: 1px solid var(--border-strong); border-bottom-width: 2px; border-radius: 4px; background: var(--surface); color: var(--text-2); }
  .spinner { width: 14px; height: 14px; flex: none; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: spin 700ms linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Top bar */
  .topbar { position: sticky; top: 0; z-index: 20; border-bottom: 1px solid var(--border);
    background: color-mix(in srgb, var(--surface) 86%, transparent); backdrop-filter: saturate(1.4) blur(12px); }
  .topbar-inner { max-width: 1400px; margin: 0 auto; padding: 10px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; }
  .brand { display: flex; align-items: center; gap: 12px; margin-right: auto; min-width: 0; }
  .brand-mark { width: 34px; height: 34px; flex: none; display: grid; place-items: center; border-radius: 9px; background: var(--ink); color: var(--on-ink); }
  .brand-name { font: 600 15px/1.25 var(--display); letter-spacing: -0.01em; }
  .brand-tag { font-size: 12.5px; color: var(--muted); }
  .topbar-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
  .identity { display: flex; align-items: center; gap: 10px; }
  .identity-label { font-size: 12.5px; color: var(--muted); }
  .identity-control { position: relative; display: flex; align-items: center; gap: 10px; height: 44px; min-width: 260px; padding: 0 12px 0 6px;
    border: 1px solid var(--border-strong); border-radius: 11px; background: var(--surface); box-shadow: var(--shadow-1);
    transition: border-color 150ms ease-out, background-color 150ms ease-out; }
  .identity-control:hover { background: var(--surface-2); }
  .identity-control:has(select:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
  .identity-control select { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; font-size: 16px; }
  .monogram { width: 32px; height: 32px; flex: none; display: grid; place-items: center; border-radius: 6px; font-size: 11.5px; font-weight: 700; letter-spacing: 0.02em; }
  .monogram.is-harbor { background: var(--accent-soft); color: var(--accent); }
  .monogram.is-redline { background: var(--surface-3); color: var(--text); }
  .identity-text { display: grid; min-width: 0; flex: 1; line-height: 1.3; }
  .identity-company { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .identity-role { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .identity-chevron { color: var(--muted); }
  .health { display: flex; align-items: center; height: 36px; padding: 0 4px; border: 1px solid var(--border); border-radius: 999px;
    background: var(--surface); font-size: 12.5px; color: var(--text-2); white-space: nowrap; }
  .health > span { padding: 0 10px; }
  .health > span + span { border-left: 1px solid var(--border); }
  .health-state { display: flex; align-items: center; gap: 7px; font-weight: 600; color: var(--text); }
  .health-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .health.is-ok .health-dot { background: var(--ok); box-shadow: 0 0 0 3px var(--ok-bg); }
  .health.is-degraded .health-dot { background: var(--warn-solid); box-shadow: 0 0 0 3px var(--warn-bg); }

  /* Page layout */
  .page { max-width: 1400px; margin: 0 auto; padding: 24px; display: grid; gap: 24px; grid-template-columns: minmax(0, 1fr); }
  @media (min-width: 1024px) { .page { grid-template-columns: 330px minmax(0, 1fr); align-items: start; } }
  @media (min-width: 1366px) { .page { grid-template-columns: 360px minmax(0, 1fr); } }
  .rail { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; align-content: start; min-width: 0; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow-1); }

  /* Composer */
  .composer { padding: 16px; display: grid; gap: 10px; }
  .question { min-height: 104px; font-size: 15px; }
  .scenario-note { display: flex; gap: 8px; align-items: flex-start; font-size: 12.5px; color: var(--text-2); text-wrap: pretty; }
  .scenario-note .icon { margin-top: 2px; color: var(--accent); }
  .composer-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; }
  .topk { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-2); }
  .topk .input { width: 60px; height: 36px; padding: 0 8px; }
  .ask-btn { margin-left: auto; min-width: 148px; height: 40px; }
  .ask-btn kbd { border: 0; background: color-mix(in srgb, var(--on-ink) 16%, transparent); color: inherit; opacity: 0.8; }
  .ask-keys { display: inline-flex; gap: 3px; }
  .scenarios { padding: 0 4px; }
  .rail-heading { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 12px; }
  .scen-group + .scen-group { margin-top: 14px; }
  .scen-title { font-size: 12px; font-weight: 500; color: var(--muted); margin-bottom: 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip-btn { height: 32px; padding: 0 12px; border: 1px solid var(--border-strong); border-radius: 999px; background: var(--surface);
    font-size: 13px; cursor: pointer; transition: border-color 150ms ease-out, background-color 150ms ease-out, color 150ms ease-out; }
  .chip-btn:hover { background: var(--surface-2); }
  .chip-btn[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .rail-foot { padding: 16px 4px 0; border-top: 1px solid var(--border); display: grid; gap: 8px; justify-items: start; }
  .rail-foot p { font-size: 12.5px; color: var(--muted); text-wrap: pretty; }

  /* Results */
  .results { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; align-content: start; min-width: 0; }
  .results:focus { outline: none; }
  .hero { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow-2); overflow: hidden; }
  .verdict { padding: 20px 24px 18px; }
  .verdict-top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
  .badge { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 12px 0 10px; border-radius: 999px;
    background: var(--tone-bg); color: var(--tone); box-shadow: inset 0 0 0 1px var(--tone-line); font-size: 13px; font-weight: 600; }
  .verdict-reason { flex: 1 1 240px; font-size: 14px; color: var(--text-2); text-wrap: pretty; }
  .elapsed { font: 600 20px/1 var(--display); font-variant-numeric: tabular-nums; color: var(--text); }
  .verdict-question { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; margin-top: 14px; font-size: 13.5px; color: var(--muted); }
  .asked-as { font-size: 12px; font-weight: 600; color: var(--text-2); padding: 2px 8px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--border); }
  .answer { margin-top: 8px; max-width: 72ch; font: 400 19px/1.5 var(--display); letter-spacing: -0.005em; white-space: pre-wrap; overflow-wrap: anywhere; text-wrap: pretty; }
  .verdict-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; margin-top: 16px; font-size: 12.5px; color: var(--muted); }
  .sec-link { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border: 0; border-radius: 7px; cursor: pointer;
    background: var(--tone-bg); color: var(--tone); box-shadow: inset 0 0 0 1px var(--tone-line); font-size: 12.5px; font-weight: 600;
    transition: box-shadow 150ms ease-out; }
  .sec-link:hover { box-shadow: inset 0 0 0 1px var(--tone); }
  .skeleton { display: grid; gap: 10px; margin-top: 12px; }
  .skeleton span { display: block; height: 16px; border-radius: 6px; background: linear-gradient(90deg, var(--surface-2), var(--surface-3), var(--surface-2)); background-size: 200% 100%; animation: shimmer 1.4s ease-in-out infinite; }
  .skeleton span:nth-child(1) { width: 92%; } .skeleton span:nth-child(2) { width: 76%; } .skeleton span:nth-child(3) { width: 48%; }
  @keyframes shimmer { from { background-position: 100% 0; } to { background-position: -100% 0; } }
  .empty-title { font: 600 20px/1.3 var(--display); letter-spacing: -0.01em; text-wrap: balance; }
  .empty-text { margin-top: 8px; max-width: 64ch; color: var(--text-2); text-wrap: pretty; }
  .empty-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-top: 16px; font-size: 13px; }

  /* Defence pipeline, the hero visual */
  .pipeline { padding: 16px 24px 18px; border-top: 1px solid var(--border); background: var(--surface-2); }
  .pipe-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px; margin-bottom: 10px; }
  .pipe-head h3 { font-size: 13.5px; font-weight: 600; }
  .pipe-head p { font-size: 12.5px; color: var(--muted); }
  .pipe { list-style: none; padding: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
  .pipe li { position: relative; }
  .pipe li:not(:last-child)::after { content: ""; position: absolute; top: 27px; left: 52px; right: -14px; height: 2px; border-radius: 2px; background: var(--border-strong); }
  .pipe-step { position: relative; z-index: 1; display: grid; gap: 1px; width: 100%; height: 100%; padding: 12px; text-align: left;
    border: 1px solid transparent; border-radius: 10px; background: transparent;
    transition: background-color 150ms ease-out, border-color 150ms ease-out, box-shadow 150ms ease-out; }
  button.pipe-step { cursor: pointer; }
  button.pipe-step:hover { background: color-mix(in srgb, var(--surface) 70%, transparent); }
  .pipe-step[aria-pressed="true"] { background: var(--surface); border-color: var(--border); box-shadow: var(--shadow-1); }
  .pipe-dot { width: 32px; height: 32px; margin-bottom: 8px; display: grid; place-items: center; border-radius: 50%;
    background: var(--tone-solid); color: var(--on-tone-solid); box-shadow: inset 0 0 0 1px var(--tone-line); font-size: 12.5px; font-weight: 700; }
  .pipe-step.tone-warn .pipe-dot, .pipe-step.tone-bad .pipe-dot, .pipe-step.tone-conflict .pipe-dot { box-shadow: 0 0 0 4px var(--tone-bg); }
  .pipe-name { font-size: 13.5px; font-weight: 600; color: var(--text); }
  .pipe-word { font-size: 12.5px; font-weight: 600; color: var(--tone); }
  .pipe-step.tone-idle .pipe-word { color: var(--muted); }
  .pipe-fact { font-size: 12px; line-height: 1.4; color: var(--muted); text-wrap: pretty; }
  .pipe-detail { position: relative; margin-top: 10px; padding: 10px 14px; display: grid; gap: 2px;
    border: 1px solid var(--border); border-radius: 10px; background: var(--surface); font-size: 13px; }
  .pipe-detail-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; color: var(--muted); font-size: 12.5px; }
  .pipe-detail-head strong { color: var(--text); font-size: 13px; }
  .pipe-detail::before { content: ""; position: absolute; top: -7px; width: 12px; height: 12px; transform: rotate(45deg);
    left: calc(var(--caret, 4) * ((100% - 32px) / 5 + 8px) + 22px); background: var(--surface);
    border-left: 1px solid var(--border); border-top: 1px solid var(--border); transition: left 200ms ease-out; }
  .pipe-log { font-family: var(--mono); font-size: 12.5px; color: var(--text-2); overflow-wrap: anywhere; }
  @keyframes step-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes pulse { 0%, 100% { box-shadow: inset 0 0 0 1px var(--border-strong); } 50% { box-shadow: inset 0 0 0 1px var(--border-strong), 0 0 0 5px var(--accent-ring); } }

  /* Tabs and panels */
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); overflow-x: auto; scrollbar-width: none; }
  .tab { position: relative; display: inline-flex; align-items: center; gap: 8px; height: 42px; padding: 0 12px; border: 0; background: none;
    font-size: 13.5px; font-weight: 600; color: var(--muted); white-space: nowrap; cursor: pointer; transition: color 150ms ease-out; }
  .tab:hover, .tab[aria-selected="true"] { color: var(--text); }
  .tab[aria-selected="true"]::after { content: ""; position: absolute; left: 8px; right: 8px; bottom: -1px; height: 2px; border-radius: 2px; background: var(--text); }
  .tab:focus-visible { outline-offset: -2px; border-radius: 8px; }
  .count { min-width: 20px; height: 20px; padding: 0 6px; display: inline-grid; place-items: center; border-radius: 999px;
    background: var(--surface-3); color: var(--text-2); font-size: 11.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .count[class*="tone-"] { background: var(--tone-bg); color: var(--tone); box-shadow: inset 0 0 0 1px var(--tone-line); }
  .tabpanel { padding-top: 16px; }
  .tabpanel:focus-visible { outline-offset: 4px; border-radius: 4px; }
  .stack { display: grid; gap: 12px; }
  .panel-card { list-style: none; padding: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow-1); }
  .panel-note { font-size: 12.5px; color: var(--muted); }
  .panel-heading { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 13.5px; font-weight: 600; }
  .empty-panel { padding: 20px; border: 1px dashed var(--border-strong); border-radius: 12px; color: var(--text-2); }
  .src { display: inline-flex; align-items: center; height: 24px; padding: 0 8px; border: 1px solid var(--border); border-radius: 6px;
    background: var(--surface-2); color: var(--accent); font: 500 12px/1 var(--mono); white-space: nowrap; cursor: pointer;
    transition: border-color 150ms ease-out, background-color 150ms ease-out; }
  .src:hover { border-color: var(--accent); background: var(--accent-soft); }
  .src.is-static { color: var(--text-2); cursor: default; }

  .cite { display: grid; gap: 8px; padding: 16px 18px; }
  .cite + .cite, .finding + .finding, .conflict + .conflict { border-top: 1px solid var(--border); }
  .cite-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
  .cite-title { font-weight: 600; }
  .cite-kind { font-size: 12px; color: var(--muted); }
  .cite-quote { padding: 2px 0 2px 12px; border-left: 2px solid var(--border-strong); color: var(--text-2); line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; }

/* ---------- DOM helpers: all server data enters the DOM as text nodes ---------- */

function el(tag, attrs, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs || {})) {
    if (value == null || value === false) continue;
    if (key.startsWith('on') && typeof value === 'function') node.addEventListener(key.slice(2), value);
    else if (key === 'class') node.className = value;
    else node.setAttribute(key, value === true ? '' : String(value));
  }
  for (const child of children.flat(Infinity)) {
    if (child == null || child === false) continue;
    node.append(child instanceof Node ? child : String(child));
  }
  return node;

function icon(name, size) {

  const data = await res.json().catch(() => null);
  if (res.ok) return data;
  const e = (data && data.error) || {};
  throw apiError(res.status, e.code || 'http_' + res.status, e.message || res.statusText || 'Request failed', e.details);
}

function errorBanner(err) {
  const fields = list(err.details).filter((d) => d && d.msg)
    .map((d) => el('li', {}, el('strong', {}, list(d.loc).slice(1).join('.') || 'request'), ': ', d.msg));
  const banner = el('div', { class: 'banner', role: 'alert' },
    el('span', { class: 'banner-icon' }, icon('alert', 18)),
    el('div', {},
      el('p', { class: 'banner-code' }, (err.status ? err.status + ' ' : '') + (err.code || 'client_error')),
      el('p', { class: 'banner-msg' }, err.message || String(err)),
      fields.length ? el('ul', { class: 'banner-fields' }, fields) : null),
    el('button', { type: 'button', class: 'btn btn-ghost btn-icon btn-sm', 'aria-label': 'Dismiss error', onclick: () => banner.remove() }, icon('x')));
  return banner;
}

/* ---------- Top bar ---------- */

async function loadHealth() {
  const box = $('health');
  const dot = () => el('span', { class: 'health-dot', 'aria-hidden': 'true' });
  try {
    const h = await (await fetch('/health')).json();

    box.className = 'health ' + (ok ? 'is-ok' : 'is-degraded');

      'Retrieval: ' + (rt.detail || rt.mode || 'unknown') + (rt.embedding_model ? ' (' + rt.embedding_model + ')' : '')].join('\n');
    box.replaceChildren(

/* ---------- Ask ---------- */

async function onAsk(event) {
  event.preventDefault();
  if (state.running) return;
  const who = currentPrincipal();
  const question = $('question').value;
  const started = Date.now();
  renderLoading(who, question);
  setRunning(true, started);
  try {
    const body = JSON.stringify({ question, top_k: Number($('top-k').value) });
    const r = await api('/ask', { method: 'POST', body }, who);
    state.result = { r, who, question, secs: Math.round((Date.now() - started) / 1000) };
    renderResult();
  } catch (err) {
    showResultsError(err);
  } finally {
    setRunning(false);
  }
}

function setRunning(on, started) {
  state.running = on;
  clearInterval(state.timer);
  const btn = $('ask-btn');
  btn.disabled = on;
  btn.classList.toggle('is-busy', on);
  if (!on) {
    btn.replaceChildren('Ask', askKeys());
    return;
  }
  const secs = el('span', { class: 'tnum' }, '0 s');
  btn.replaceChildren(el('span', { class: 'spinner', 'aria-hidden': 'true' }), 'Running ', secs);
  const tick = () => {
    const text = Math.floor((Date.now() - started) / 1000) + ' s';
    secs.textContent = text;
    if ($('elapsed')) $('elapsed').textContent = text;
  };
  tick();
  state.timer = setInterval(tick, 250);
}

function askKeys() {
  const mod = /Mac|iPhone|iPad/.test(navigator.platform) ? 'Cmd' : 'Ctrl';
  return el('span', { class: 'ask-keys', 'aria-hidden': 'true', title: mod + ' + Enter' }, el('kbd', {}, mod), el('kbd', {}, 'Enter'));
}

function questionLine(who, question) {
  return el('p', { class: 'verdict-question' }, el('span', { class: 'asked-as' }, whoLabel(who)), el('span', {}, question));
}

function renderLoading(who, question) {
  $('results').replaceChildren(el('section', { class: 'hero', 'aria-busy': 'true', 'aria-label': 'Running' },
    el('div', { class: 'verdict' },
      el('div', { class: 'verdict-top' },
        el('span', { class: 'badge tone-idle' }, el('span', { class: 'spinner', 'aria-hidden': 'true' }), 'Running'),
        el('p', { class: 'verdict-reason' }, 'Answers take 10 to 50 seconds on this CPU.'),
        el('span', { class: 'elapsed', id: 'elapsed' }, '0 s')),
      questionLine(who, question),
      el('div', { class: 'skeleton', 'aria-hidden': 'true' }, el('span'), el('span'), el('span'))),
    pipelineView(null, 'running')));
  announce('Running as ' + whoLabel(who));
}

function renderResult(banner) {
  const { r, who, question, secs } = state.result;
  $('results').replaceChildren(...[banner, heroView(r, who, question, secs), tabsView(r)].filter(Boolean));
  announce('Result: ' + (STATUS[r.status] || STATUS.abstained).label + '. ' + reasonText(r));
}

function showResultsError(err) {
  const banner = errorBanner(err);
  if (state.result) renderResult(banner);
  else $('results').replaceChildren(banner, emptyState());
}

function emptyState() {
  return el('section', { class: 'hero', 'aria-labelledby': 'empty-h' },
    el('div', { class: 'verdict' },
      el('h2', { id: 'empty-h', class: 'empty-title' }, 'Ask a procurement question'),
      el('p', { class: 'empty-text' }, 'Every question runs through the five steps below before an answer is shown. ' +
        'The result marks what each step found, the evidence behind the answer and anything that was removed or blocked.'),
      el('div', { class: 'empty-actions' },
        el('button', { type: 'button', class: 'btn btn-secondary', onclick: tryInjection }, 'Load the poisoned vendor quote'),
        el('span', { class: 'muted' }, 'as Harbor Point Clinics, buyer'))),

}

function tryInjection() {
  $('who').value = PRINCIPALS[0].key;

}

/* ---------- Verdict ---------- */

function reasonText(r) {
  if (!r.reason) return (STATUS[r.status] || STATUS.abstained).reason;
  return r.reason.split(',').map((code) => REASONS[code.trim()] || code).join(' ');
}

function findingCount(sec) {
  const s = sec || {};
  return list(s.flagged_sources).length + list(s.blocked_actions).length + list(s.rejected_citations).length + list(s.output_checks).length;
}

function securityTone(r) {
  const s = r.security || {};
  if (list(s.output_checks).length || list(s.blocked_actions).length) return 'bad';
  return findingCount(s) ? 'warn' : 'ok';
}

function securitySummary(sec) {
  return [
    [list(sec.flagged_sources).length, 'source flagged', 'sources flagged'],
    [list(sec.blocked_actions).length, 'action blocked', 'actions blocked'],
    [list(sec.rejected_citations).length, 'citation rejected', 'citations rejected'],
    [list(sec.output_checks).length, 'output check failed', 'output checks failed'],
  ].filter(([n]) => n > 0).map(([n, one, many]) => n + ' ' + (n === 1 ? one : many)).join(', ');
}

function heroView(r, who, question, secs) {
  const info = STATUS[r.status] || STATUS.abstained;
  return el('section', { class: 'hero', 'aria-labelledby': 'verdict-h' },
    el('div', { class: 'verdict' },
      el('div', { class: 'verdict-top' },
        el('h2', { id: 'verdict-h', class: 'badge tone-' + info.tone }, icon(TONE_ICON[info.tone], 14), info.label),
        el('p', { class: 'verdict-reason' }, reasonText(r))),
      questionLine(who, question),
      el('p', { class: 'answer' }, r.answer),
      verdictMeta(r, secs)),
    pipelineView(r));
}

function verdictMeta(r, secs) {
  const sec = r.security || {};
  const issues = findingCount(sec);
  return el('div', { class: 'verdict-meta' },
    el('button', { type: 'button', class: 'sec-link tone-' + securityTone(r), onclick: () => selectTab('security', true) },
      icon(issues ? 'alert' : 'shieldCheck', 14), issues ? securitySummary(sec) : 'No security issues'),
    el('span', { class: 'tnum' }, plural(list(r.citations).length, 'citation')),
    el('span', {}, 'Model ', el('span', { class: 'mono' }, r.model)),
    el('span', {}, 'Trace ', el('span', { class: 'mono' }, r.trace_id)),
    secs == null ? null : el('span', { class: 'tnum' }, secs + ' s'));
}

/* ---------- Defence pipeline ---------- */

const outcome = (tone, word, fact) => ({ tone, word, fact });

const OUTCOMES = {
  retriever(r) {
    const kept = list(r.retrieved).length;
    const out = list(r.excluded_sources).length;
    if (!kept) return outcome('info', 'Nothing found', 'No visible record matched');
    return outcome('ok', 'Searched', plural(kept, 'source') + ' kept' + (out ? ', ' + out + ' excluded' : ''));
  },
  tool_runner(r, summary) {
    if (/returned/.test(summary)) return outcome('ok', 'Called', 'Vendor quote fetched');
    if (/skipped/.test(summary)) return outcome('idle', 'Skipped', 'Role lacks clearance');
    return outcome('idle', 'Not needed', 'No SKU in the question');
  },
  guard(r) {
    const n = list((r.security || {}).flagged_sources).length;
    return n ? outcome('warn', 'Flagged', plural(n, 'source') + ' cleaned') : outcome('ok', 'Clean', 'No injection found');
  },
  answerer(r, summary) {
    if (/violated/.test(summary)) return outcome('bad', 'Rejected', 'Reply broke the format');
    const secs = (summary.match(/(\d+(?:\.\d+)?)s\b/) || [])[1];
    return outcome('ok', 'Replied', secs ? secs + ' s, format ok' : 'Format ok');
  },
  verifier(r) {
    const sec = r.security || {};
    const checks = list(sec.output_checks).length;
    if (r.status === 'blocked') return outcome('bad', 'Blocked', checks ? plural(checks, 'check') + ' failed' : 'Answer withheld');
    if (r.status === 'conflict') return outcome('conflict', 'Conflict', 'Sources disagree');
    if (r.status === 'abstained') return outcome('info', 'Abstained', 'Not enough evidence');
    const dropped = list(sec.blocked_actions).length + list(sec.rejected_citations).length;
    if (dropped) return outcome('warn', 'Contained', plural(dropped, 'item') + ' dropped');
    return outcome('ok', 'Passed', plural(list(r.citations).length, 'citation') + ' checked');
  },
};

function stepOutcome(step, r) {
  const entry = list(r.agents).find((a) => a && a.agent === step.agent);
  if (!entry) {
    return { tone: 'idle', word: 'Not run', fact: step.agent === 'answerer' ? 'Model not called' : 'Skipped for this question', summary: '' };
  }
  const raw = String(entry.summary || '');
  return { ...OUTCOMES[step.agent](r, raw), summary: tidy(raw) };
}

function defaultStep(outcomes) {
  for (const tone of ['bad', 'warn', 'conflict']) {
    const i = outcomes.findIndex((o) => o.tone === tone);
    if (i >= 0) return i;
  }
  return STEPS.length - 1;
}

function pipelineView(r, mode) {
  const outcomes = STEPS.map((s) => (r ? stepOutcome(s, r) : outcome('idle', '', s.does)));
  const detail = r ? el('div', { class: 'pipe-detail', id: 'pipe-detail', 'aria-live': 'polite' }) : null;
  const nodes = STEPS.map((s, i) => {
    const o = outcomes[i];
    const parts = [
      el('span', { class: 'pipe-dot' }, r ? icon(TONE_ICON[o.tone] || 'minus', 16) : String(i + 1)),
      el('span', { class: 'pipe-name' }, s.name),
      o.word ? el('span', { class: 'pipe-word' }, o.word) : null,
      el('span', { class: 'pipe-fact' }, o.fact),
    ];
    const node = r
      ? el('button', { type: 'button', class: 'pipe-step tone-' + o.tone, 'aria-pressed': 'false', 'aria-controls': 'pipe-detail',
        title: o.summary || s.does, onclick: () => selectStep(i) }, parts)
      : el('div', { class: 'pipe-step tone-idle' }, parts);
    return el('li', { style: '--i:' + i }, node);
  });
  const selectStep = (i) => {
    nodes.forEach((li, j) => li.firstChild.setAttribute('aria-pressed', String(i === j)));
    detail.style.setProperty('--caret', String(i));
    detail.replaceChildren(
      el('p', { class: 'pipe-detail-head' }, el('strong', {}, STEPS[i].name), el('span', {}, STEPS[i].does)),
      el('p', { class: 'pipe-log' }, outcomes[i].summary || 'Did not run for this question.'));
  };
  if (r) selectStep(defaultStep(outcomes));
  const note = r ? 'Select a step to see its log line' : mode === 'running' ? 'Running' : 'Runs on every question';
  return el('section', { class: 'pipeline', 'aria-labelledby': 'pipe-h' },
    el('div', { class: 'pipe-head' }, el('h3', { id: 'pipe-h' }, 'Defence pipeline'), el('p', {}, note)),
    el('ol', { class: 'pipe' + (r ? ' is-revealing' : mode === 'running' ? ' is-running' : '') }, nodes),
    detail);
}

/* ---------- Tabs ---------- */

function tabsView(r) {
  const sec = r.security || {};
  const issues = findingCount(sec);
  const conflicts = list(r.conflicts).length;
  const defs = [
    ['evidence', 'Evidence', list(r.citations).length, null, evidencePanel(r)],
    ['security', 'Security', issues, securityTone(r), securityPanel(sec)],
    ['conflicts', 'Conflicts', conflicts, conflicts ? 'conflict' : null, conflictsPanel(r.conflicts)],
    ['retrieval', 'Retrieval', list(r.retrieved).length, null, retrievalPanel(r)],
    ['raw', 'Raw JSON', null, null, el('pre', { class: 'json' }, JSON.stringify(r, null, 2))],
  ];
  const tablist = el('div', { class: 'tabs', role: 'tablist', 'aria-label': 'Result details', onkeydown: onTabKey });
  const panels = defs.map(([id, label, count, tone, panel]) => {
    tablist.append(el('button', { type: 'button', role: 'tab', id: 'tab-' + id, class: 'tab', 'aria-controls': 'panel-' + id, onclick: () => selectTab(id) },
      label, count == null ? null : el('span', { class: 'count' + (tone ? ' tone-' + tone : '') }, String(count))));
    return el('div', { role: 'tabpanel', id: 'panel-' + id, class: 'tabpanel', 'aria-labelledby': 'tab-' + id, tabindex: '0' }, panel);
  });
  const root = el('section', { class: 'details', 'aria-label': 'Result details' }, tablist, panels);
  setTabState(root, issues ? 'security' : conflicts ? 'conflicts' : 'evidence');
  return root;
}

function setTabState(root, id) {
  for (const tab of root.querySelectorAll('[role="tab"]')) {
    const on = tab.id === 'tab-' + id;
    tab.setAttribute('aria-selected', String(on));
    tab.tabIndex = on ? 0 : -1;
  }
  for (const panel of root.querySelectorAll('[role="tabpanel"]')) panel.hidden = panel.id !== 'panel-' + id;
}

function selectTab(id, focus) {
  const root = document.querySelector('.details');
  if (!root) return;
  setTabState(root, id);
  if (focus) {
    $('tab-' + id).focus();
    $('tab-' + id).scrollIntoView({ block: 'nearest' });
  }
}

function onTabKey(e) {
  const tabs = Array.from(e.currentTarget.querySelectorAll('[role="tab"]'));
  const i = tabs.indexOf(document.activeElement);
  const target = { ArrowRight: i + 1, ArrowLeft: i - 1, Home: 0, End: tabs.length - 1 }[e.key];
  if (i < 0 || target === undefined) return;
  e.preventDefault();
  selectTab(tabs[(target + tabs.length) % tabs.length].id.slice(4), true);
}

function emptyPanel(text) {
  return el('p', { class: 'empty-panel' }, text);
}

function sourceChip(id, who) {
  if (typeof id !== 'string' || !SOURCE_ID.test(id)) return el('span', { class: 'src is-static' }, String(id));
  return el('button', { type: 'button', class: 'src', title: 'Open ' + id,
    onclick: () => openSource(id, who || (state.result && state.result.who) || currentPrincipal()) }, id);
}

/* ---------- Evidence ---------- */

function evidencePanel(r) {
  const cites = list(r.citations);
  if (!cites.length) return emptyPanel('No citations. Abstained and blocked results carry none; the Retrieval tab lists what was read.');
  return el('ol', { class: 'panel-card' }, cites.map(citationItem));
}

function citationItem(c) {
  const slot = el('span', { class: 'verify-slot' });
  const btn = el('button', { type: 'button', class: 'btn btn-secondary btn-sm', onclick: () => verifyCitation(c, slot, btn) },
    icon('shieldCheck', 14), 'Verify');
  slot.append(btn);
  return el('li', { class: 'cite' },
    el('div', { class: 'cite-head' }, sourceChip(c.source_id), el('span', { class: 'cite-title' }, c.title), el('span', { class: 'cite-kind' }, kindLabel(c.kind))),
    el('blockquote', { class: 'cite-quote' }, c.excerpt),
    el('div', { class: 'cite-foot' },
      el('span', { class: 'tnum' }, 'Characters ' + c.start + ' to ' + c.end),
      el('span', { title: 'SHA-256 ' + c.content_sha256 }, 'SHA-256 ', el('span', { class: 'mono' }, shortHash(c.content_sha256))),
      slot));
}

async function sha256Hex(text) {
  if (!window.isSecureContext || !window.crypto || !crypto.subtle) return null;
  const digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return Array.from(new Uint8Array(digest), (b) => b.toString(16).padStart(2, '0')).join('');
}

async function checkCitation(c, who) {
  let src;
  try {
    src = await api('/sources/' + encodeURIComponent(c.source_id), {}, who);
  } catch (err) {
    return { tone: 'bad', label: 'Not verified', detail: err.status === 404 ? 'Source not available to this caller' : 'Could not fetch source (' + err.code + ')' };
  }
  // Offsets are Python code point indices, so slice code points, not UTF-16 units.
  const spanOk = Array.from(src.text).slice(c.start, c.end).join('') === c.excerpt;
  const hash = await sha256Hex(src.text);
  if (hash === null) {
    return { tone: spanOk ? 'warn' : 'bad', label: spanOk ? 'Excerpt matches' : 'Mismatch', detail: 'SHA-256 not checked: needs a secure context' };
  }
  const hashOk = hash === c.content_sha256;
  if (spanOk && hashOk) return { tone: 'ok', label: 'Verified', detail: 'Excerpt and SHA-256 match the stored source' };
  const problems = [spanOk ? null : 'excerpt differs from the stored text', hashOk ? null : 'SHA-256 differs'];
  return { tone: 'bad', label: 'Mismatch', detail: problems.filter(Boolean).join(', ') };
}

async function verifyCitation(c, slot, btn) {
  btn.disabled = true;
  btn.replaceChildren(el('span', { class: 'spinner', 'aria-hidden': 'true' }), 'Checking');
  const who = state.result ? state.result.who : currentPrincipal();
  const res = await checkCitation(c, who);
  slot.replaceChildren(
    el('span', { class: 'verify-detail' }, res.detail),
    el('span', { class: 'verify-status tone-' + res.tone, role: 'status' }, icon(TONE_ICON[res.tone], 14), res.label));
}

/* ---------- Security ---------- */

function findingRow(tone, kind, subject, text, extra) {
  return el('li', { class: 'finding tone-' + tone },
    el('span', { class: 'finding-icon' }, icon(TONE_ICON[tone], 16)),
    el('div', {},
      el('div', { class: 'finding-head' }, el('span', { class: 'finding-kind' }, kind), subject),
      el('p', { class: 'finding-text' }, text),
      extra));
}

function ruleList(rules) {
  return el('ul', { class: 'rules' }, list(rules).map((rule) => el('li', {}, el('code', { class: 'rule' }, rule), el('span', {}, RULES[rule] || ''))));
}

function securityPanel(sec) {
  const groups = [
    [list(sec.flagged_sources), 'flagged sources', (f) => findingRow('warn', 'Flagged source', [sourceChip(f.source_id),
      el('button', { type: 'button', class: 'btn btn-secondary btn-sm finding-action', onclick: () => openSource(f.source_id, state.result.who) }, 'Show removed text')],
      'Instruction-like sentences were removed before the model read this source.', ruleList(f.rules))],
    [list(sec.blocked_actions), 'blocked actions', (b) => findingRow('bad', 'Blocked action', el('span', { class: 'src is-static' }, b.origin),
      b.detail + '. Actions requested by text are never executed.')],
    [list(sec.rejected_citations), 'rejected citations', (n) => findingRow('warn', 'Rejected citation', sourceChip(n.source_id),
      'Cited, but ' + n.reason + '.')],
    [list(sec.output_checks), 'failed output checks', (c) => findingRow('bad', 'Failed output check', el('code', { class: 'rule' }, c),
      REASONS[c] || 'The answer failed this check and was withheld.')],
  ];
  const rows = groups.flatMap(([items, , render]) => items.map(render));
  if (!rows.length) {
    return el('div', { class: 'panel-card all-clear tone-ok' },
      el('span', { class: 'finding-icon' }, icon('shieldCheck', 18)),
      el('div', {}, el('p', { class: 'all-clear-title' }, 'No issues'),
        el('p', { class: 'muted' }, 'No flagged sources, blocked actions, rejected citations or failed output checks.')));
  }
  const clear = groups.filter(([items]) => !items.length).map(([, name]) => name);
  return el('div', { class: 'stack' },
    el('ul', { class: 'panel-card' }, rows),
    clear.length ? el('p', { class: 'clear-note' }, icon('check', 14), 'No ' + clear.join(', ').replace(/, ([^,]*)$/, ' or $1') + '.') : null);
}

/* ---------- Conflicts and retrieval ---------- */

function formatDate(iso) {
  const d = new Date(iso);
  return isNaN(d) ? String(iso) : d.toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: 'numeric' });
}

function conflictsPanel(conflicts) {
  const items = list(conflicts);
  if (!items.length) return emptyPanel('No conflicting facts among the sources used.');
  return el('div', { class: 'panel-card' }, items.map((c) => el('div', { class: 'conflict tone-conflict' },
    el('div', { class: 'conflict-head' },
      el('span', { class: 'finding-icon' }, icon('compare', 16)),
      el('div', {}, el('p', { class: 'finding-kind' }, humanize(c.fact)),
        el('p', { class: 'finding-text' }, 'Sources disagree. Every value is shown so a person can decide.'))),
    el('ul', { class: 'conflict-values' }, list(c.values).map((v) => el('li', {},
      sourceChip(v.source_id), el('strong', {}, v.value), el('span', { class: 'muted' }, 'updated ' + formatDate(v.updated_at))))))));
}

function scoreCell(score, max) {
  const pct = Math.round(Math.max(0, Math.min(1, (Number(score) || 0) / max)) * 100);
  return el('div', { class: 'score' }, el('span', { class: 'score-bar', 'aria-hidden': 'true' }, el('span', { style: 'width:' + pct + '%' })),
    el('span', { class: 'tnum' }, num(score, 3)));
}

function retrievalPanel(r) {
  const hits = list(r.retrieved);
  const excluded = list(r.excluded_sources);
  const max = Math.max(0, ...hits.map((h) => Number(h.score) || 0)) || 1;
  const rows = hits.map((h) => el('tr', {},
    el('td', {}, sourceChip(h.source_id)), el('td', {}, scoreCell(h.score, max)),
    el('td', { class: 'num' }, num(h.bm25, 2)), el('td', { class: 'num' }, num(h.dense, 3))));
  const head = el('tr', {}, el('th', { scope: 'col' }, 'Source'), el('th', { scope: 'col' }, 'Fused score'),
    el('th', { scope: 'col', class: 'num' }, 'BM25'), el('th', { scope: 'col', class: 'num' }, 'Dense similarity'));
  return el('div', { class: 'stack' },
    hits.length
      ? el('div', { class: 'panel-card table-wrap' }, el('table', {}, el('thead', {}, head), el('tbody', {}, rows)))
      : emptyPanel('Nothing was retrieved above the relevance threshold.'),
    el('p', { class: 'panel-note' }, 'Fused score combines BM25 keyword match and dense embedding similarity. Only records this caller may see are searched.'),
    el('h3', { class: 'panel-heading' }, 'Excluded sources', el('span', { class: 'count' }, String(excluded.length))),
    excluded.length
      ? el('ul', { class: 'panel-card plain-list' }, excluded.map((x) => el('li', {}, sourceChip(x.source_id), el('span', {}, x.reason))))
      : el('p', { class: 'panel-note' }, 'None.'));
}

/* ---------- Source drawer ---------- */

function openDialog(dialog) {
  if (dialog.open) return;
  const opener = document.activeElement;
  dialog.addEventListener('close', () => { if (opener && opener.isConnected) opener.focus(); }, { once: true });
  dialog.showModal();
}

function closeOnBackdrop(e) {
  if (e.target === e.currentTarget) e.currentTarget.close();
}

async function openSource(id, who) {
  const seq = ++state.drawerSeq;
  $('drawer-id').textContent = id;
  $('drawer-title').textContent = 'Loading source';
  $('drawer-body').replaceChildren(el('div', { class: 'skeleton', 'aria-hidden': 'true' }, el('span'), el('span'), el('span')));
  openDialog($('drawer'));
  let title;
  let nodes;
  try {
    const s = await api('/sources/' + encodeURIComponent(id), {}, who);
    title = s.title;
    nodes = sourceView(s, who);
  } catch (err) {
    title = 'Source unavailable';
    nodes = err.status === 404 ? [unavailableNotice(who)] : [errorBanner(err)];
  }
  if (seq !== state.drawerSeq) return;
  $('drawer-title').textContent = title;
  $('drawer-body').replaceChildren(...nodes);
}

function unavailableNotice(who) {
  return el('div', { class: 'notice' }, el('span', { class: 'finding-icon tone-info' }, icon('lock', 16)),
    el('div', {}, el('p', { class: 'notice-title' }, 'Not available to this caller (different tenant or role)'),
      el('p', {}, 'Viewed as ' + whoLabel(who) + '. Missing records and records of other tenants return the same answer, so ids cannot be probed.')));
}

function sourceView(s, who) {
  const spans = list(s.flagged_spans);
  const pairs = [['Tenant', s.tenant_id], ['Kind', kindLabel(s.kind)], ['Sensitivity', humanize(s.sensitivity)],
    ['Updated', formatDate(s.updated_at)], ['SHA-256', el('span', { class: 'mono', title: s.content_sha256 }, shortHash(s.content_sha256))],
    ['Viewed as', whoLabel(who)]];
  return [
    el('dl', { class: 'meta-grid' }, pairs.map(([k, v]) => [el('dt', {}, k), el('dd', {}, v)])),
    flagPanel(list(s.injection_flags), 'Flagged sentences stay in storage but are removed before any model reads this source.'),
    el('div', { class: 'stack' },
      el('div', { class: 'text-head' }, el('h3', {}, 'Full text'),
        spans.length ? el('span', { class: 'legend' }, el('span', { class: 'legend-swatch' }), 'Removed by the guard') : null),
      el('div', { class: 'source-text' }, highlightedText(s.text, spans))),
  ];
}

// Spans are Python code point offsets; Array.from splits by code point so they line up.
function highlightedText(text, spans) {
  const chars = Array.from(String(text));
  const sorted = list(spans).filter((s) => Number.isInteger(s.start) && Number.isInteger(s.end)).sort((a, b) => a.start - b.start);
  const parts = [];
  let pos = 0;
  for (const s of sorted) {
    const start = Math.max(s.start, pos);
    const end = Math.min(s.end, chars.length);
    if (end <= start) continue;
    parts.push(chars.slice(pos, start).join(''),
      el('span', { class: 'cut' }, el('span', { class: 'cut-label' }, 'Removed: ' + list(s.rules).join(', ')), el('del', {}, chars.slice(start, end).join(''))));
    pos = end;
  }
  parts.push(chars.slice(pos).join(''));
  return parts;
}

function flagPanel(flags, hint) {
  if (!flags.length) {
    return el('div', { class: 'flag-panel tone-ok' }, el('p', { class: 'flag-title' }, icon('shieldCheck', 16), 'No injection patterns found'));
  }
  return el('div', { class: 'flag-panel tone-warn' },
    el('p', { class: 'flag-title' }, icon('alert', 16), 'Injection flagged: ' + plural(flags.length, 'rule') + ' matched'),
    ruleList(flags),
    el('p', { class: 'flag-hint' }, hint));
}

/* ---------- Add record ---------- */

function openRecordDialog() {
  const p = currentPrincipal();
  $('record-sub').textContent = 'Saved to ' + p.company + ' as ' + p.role.toLowerCase() + '. Scanned for injected instructions when saved.';
  $('record-error').replaceChildren();
  openDialog($('record-dialog'));
  $('rec-title').focus();
}

async function onRecordSubmit(event) {
  event.preventDefault();
  const who = currentPrincipal();
  const btn = $('record-submit');
  const body = { title: $('rec-title').value, text: $('rec-text').value, kind: $('rec-kind').value, sensitivity: $('rec-sens').value };
  $('record-error').replaceChildren();
  btn.disabled = true;
  try {
    const rec = await api('/tickets', { method: 'POST', body: JSON.stringify(body) }, who);
    $('record-result').replaceChildren(recordView(rec, who));
    announce('Added ' + rec.id);
  } catch (err) {
    $('record-error').replaceChildren(errorBanner(err));
  } finally {
    btn.disabled = false;
    $('record-body').scrollTop = 0;
  }
}

function recordView(rec, who) {
  return el('div', { class: 'record-result' },
    el('div', { class: 'record-head tone-ok' },
      el('span', { class: 'finding-icon' }, icon('check', 16)),
      el('div', {}, el('p', { class: 'finding-kind' }, 'Added', sourceChip(rec.id, who)),
        el('p', { class: 'finding-text' }, rec.title + ' (' + kindLabel(rec.kind) + ', ' + rec.sensitivity + ', tenant ' + rec.tenant_id + ')'))),
    flagPanel(list(rec.injection_flags), 'Stored and flagged: these sentences are removed before any model reads the record.'));
}

function loadMalicious() {
  $('rec-title').value = MALICIOUS.title;
  $('rec-text').value = MALICIOUS.text;
  $('rec-kind').value = 'ticket';
  $('rec-sens').value = 'internal';
}

/* ---------- Wiring ---------- */

function init() {
  for (const slot of document.querySelectorAll('[data-icon]')) slot.append(icon(slot.dataset.icon, Number(slot.dataset.size) || 16));
  initIdentity();
  renderScenarios();
  $('ask-btn').append(askKeys());
  $('results').replaceChildren(emptyState());
  $('ask-form').addEventListener('submit', onAsk);
  $('question').addEventListener('input', syncScenario);
  $('question').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
      e.preventDefault();
      $('ask-form').requestSubmit();
    }
  });
  $('open-record').addEventListener('click', openRecordDialog);
  $('record-form').addEventListener('submit', onRecordSubmit);
  $('malicious-btn').addEventListener('click', loadMalicious);
  $('record-close').addEventListener('click', () => $('record-dialog').close());
  $('record-cancel').addEventListener('click', () => $('record-dialog').close());
  $('drawer-close').addEventListener('click', () => $('drawer').close());
  $('drawer').addEventListener('click', closeOnBackdrop);
  $('record-dialog').addEventListener('click', closeOnBackdrop);
  window.addEventListener('unhandledrejection', (e) => showResultsError(e.reason || new Error('Unexpected client error')));
  loadHealth();
}

init();
</script>
