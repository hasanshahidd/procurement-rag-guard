[pytest]
testpaths = tests
pythonpath = .
addopts = -q -m "not live"
markers =
    live: needs a running local model (set LLM_BACKEND and start Ollama), run with: pytest -m live
    e2e: drives the web UI in a real browser (Playwright); skipped when no browser is installed
filterwarnings =
    ignore::DeprecationWarning
