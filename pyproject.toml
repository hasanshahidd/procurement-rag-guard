[project]
name = "procurement-rag-guard"
version = "0.1.0"
description = "Tenant-scoped procurement RAG service with tool-output prompt injection containment"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI's Depends() in defaults is the documented pattern

[tool.ruff.lint.isort]
known-first-party = ["app", "repro", "finetune", "conftest"]
